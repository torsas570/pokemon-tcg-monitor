name: Monitor Pokemon TCG - CONTINUO (~1 check/min, todas las tiendas)

on:
  workflow_dispatch:
  schedule:
    # Red de seguridad: si la cadena se rompe, esto rearranca el bucle.
    # Minutos "raros" para esquivar la congestion del :00.
    - cron: '7,37 * * * *'

# Solo un bloque a la vez. El nuevo run espera a que acabe el actual (relevo
# sin carrera del state.json). GitHub mantiene como mucho 1 corriendo + 1 en cola.
concurrency:
  group: monitor-continuo
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # necesario para que 'gh workflow run' relance el workflow

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # tope de 6h de Actions; salimos antes por tiempo del bucle
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v5
        with:
          path: state.json
          key: monitor-state-${{ github.run_id }}
          restore-keys: monitor-state-

      # 5 tramos de 66 min (= 5 h 30 min) con el state guardado tras cada uno:
      # si GitHub pierde la máquina a mitad de bloque, se pierde como mucho 1 h.
      - name: Bucle continuo, tramo 1/5 (~1 check/min, 66 min)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WATCHDOG_TOKEN: ${{ secrets.WATCHDOG_TOKEN }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}   # ping externo (healthchecks.io); sin él no hace nada
        run: ./loop.sh 66

      - name: Guardar estado (tramo 1)
        if: always()
        uses: actions/cache/save@v5
        with:
          path: state.json
          key: monitor-state-${{ github.run_id }}-1

      - name: Bucle continuo, tramo 2/5 (~1 check/min, 66 min)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WATCHDOG_TOKEN: ${{ secrets.WATCHDOG_TOKEN }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}   # ping externo (healthchecks.io); sin él no hace nada
        run: ./loop.sh 66

      - name: Guardar estado (tramo 2)
        if: always()
        uses: actions/cache/save@v5
        with:
          path: state.json
          key: monitor-state-${{ github.run_id }}-2

      - name: Bucle continuo, tramo 3/5 (~1 check/min, 66 min)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WATCHDOG_TOKEN: ${{ secrets.WATCHDOG_TOKEN }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}   # ping externo (healthchecks.io); sin él no hace nada
        run: ./loop.sh 66

      - name: Guardar estado (tramo 3)
        if: always()
        uses: actions/cache/save@v5
        with:
          path: state.json
          key: monitor-state-${{ github.run_id }}-3

      - name: Bucle continuo, tramo 4/5 (~1 check/min, 66 min)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WATCHDOG_TOKEN: ${{ secrets.WATCHDOG_TOKEN }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}   # ping externo (healthchecks.io); sin él no hace nada
        run: ./loop.sh 66

      - name: Guardar estado (tramo 4)
        if: always()
        uses: actions/cache/save@v5
        with:
          path: state.json
          key: monitor-state-${{ github.run_id }}-4

      - name: Bucle continuo, tramo 5/5 (~1 check/min, 66 min)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WATCHDOG_TOKEN: ${{ secrets.WATCHDOG_TOKEN }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}   # ping externo (healthchecks.io); sin él no hace nada
        run: ./loop.sh 66

      - name: Guardar estado (tramo 5)
        if: always()
        uses: actions/cache/save@v5
        with:
          path: state.json
          key: monitor-state-${{ github.run_id }}-5

      - name: Encadenar el siguiente bloque (auto-relanzado)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run monitor-high.yml --ref master
